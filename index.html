<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:#fbf8f3;color:#1d1a17;font-family:'Montserrat','Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.foto{background:url(video/giris.webp) center/cover no-repeat;margin:18px;border-radius:26px;min-height:240px}
main{display:flex;flex-direction:column;justify-content:center;padding:40px clamp(24px,6vw,90px)}
.ust{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#c24a22;font-weight:700}
h1{font-weight:700;font-size:clamp(34px,4.6vw,64px);margin:14px 0 34px;line-height:1.04;letter-spacing:-.02em}
ul{list-style:none;display:grid;gap:10px;max-width:420px}
a{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border:1px solid #e3d9cb;border-radius:14px;background:#fff;color:#1d1a17;text-decoration:none;font-size:16px;font-weight:500;transition:border-color .2s,transform .2s}
a:hover,a.oneri{border-color:#c24a22}
a:hover{transform:translateX(4px)}
small{font-size:12px;color:#7a7168;font-weight:400}
footer{margin-top:34px;font-size:12px;letter-spacing:.14em;color:#7a7168}
@media(max-width:820px){body{grid-template-columns:1fr;grid-template-rows:38vh auto}.foto{margin:12px 12px 0}main{justify-content:flex-start;padding-top:28px}}
</style>
</head>
<body>
<div class="foto" role="img" aria-label="Cappadocia"></div>
<main>
  <span class="ust">Göreme · Cappadocia</span>
  <h1>Cappadocia Vista Tours</h1>
  <ul>
    <li><a href="tr/" lang="tr" hreflang="tr" data-dil="tr">Türkçe<small>Devam et &rarr;</small></a></li>
    <li><a href="en/" lang="en" hreflang="en" data-dil="en">English<small>Continue &rarr;</small></a></li>
    <li><a href="es/" lang="es" hreflang="es" data-dil="es">Español<small>Continuar &rarr;</small></a></li>
    <li><a href="zh/" lang="zh" hreflang="zh" data-dil="zh">中文<small>继续 &rarr;</small></a></li>
  </ul>
  <footer>TÜRSAB 17102</footer>
</main>
<script>
(function(){
  var kayit = null; try { kayit = localStorage.getItem('dil'); } catch (e) {}
  var diller = ["tr", "en", "es", "zh"];
  if (kayit && diller.indexOf(kayit) > -1 && location.hash !== '#sec') {
    // adresteki işaretler (?k=instagram, utm_...) dil sayfasına taşınır; VISTA varsa geldiği site de (?k=) eklenir
    var ek = location.search, r = document.referrer, a;
    if (!ek && false && r) { a = document.createElement('a'); a.href = r; if (a.host !== location.host) ek = '?k=' + encodeURIComponent(a.hostname); }
    location.replace(kayit + '/' + ek); return;
  }
  var tarayici = (navigator.language || '').slice(0,2).toLowerCase();
  var oneri = diller.indexOf(tarayici) > -1 ? tarayici : 'en';
  var a = document.querySelector('a[data-dil="' + oneri + '"]'); if (a) a.className = 'oneri';
  [].slice.call(document.querySelectorAll('a[data-dil]')).forEach(function(a){ a.addEventListener('click', function(){
    try { localStorage.setItem('dil', a.getAttribute('data-dil')); } catch (e) {}
    (window.dataLayer = window.dataLayer || []).push({ event: 'dil_secimi', dil: a.getAttribute('data-dil') });
  }); });
})();
</script>

</body>
</html>
